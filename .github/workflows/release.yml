name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # electron-builder reads the release version from package.json, not
      # the git tag -- syncing it here keeps the installer filename and the
      # GitHub Release both matching the tag that triggered this build.
      - name: Sync package version to tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      # --publish always uploads the installer straight to a GitHub Release
      # for this tag, using the repo's own GITHUB_TOKEN (no PAT needed --
      # this workflow only ever runs inside this repo, private or not).
      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win

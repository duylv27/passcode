name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # electron-builder reads the release version from package.json, not
      # the git tag -- syncing it here keeps the installer filename and the
      # GitHub Release both matching the tag that triggered this build.
      - name: Sync package version to tag
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      # --publish always uploads the installer straight to a GitHub Release
      # for this tag, using the repo's own GITHUB_TOKEN (no PAT needed --
      # this workflow only ever runs inside this repo, private or not).
      - name: Build and publish Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:win

      # CHANGELOG.md is the single source of truth for user-facing release
      # notes (see docs/superpowers/specs/2026-09-09-release-process-design.md)
      # -- electron-builder's own publish step above writes no release body,
      # so this replaces it with this version's changelog section. A tag with
      # no matching CHANGELOG.md entry (e.g. any release before this section
      # was added) leaves the release body untouched rather than failing.
      - name: Set release notes from CHANGELOG.md
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          awk -v ver="## [$VERSION]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            echo "No CHANGELOG.md section for $VERSION -- leaving the auto-generated release body as-is."
          fi
